# Publishes a Windows release of this app on its mclsrr repository, which the Design System launcher
# installs and updates from. The same file works in every Craft app repository (it reads the app id
# from the repository name).
#
# How to release: raise [workspace.package] version in Cargo.toml, commit, then push a matching tag:
#   git tag v1.2.3   git push origin v1.2.3
#
# The release carries what the launcher looks for:
#   <app>-<version>-windows-x64.msi            installed and updated by Design System
#   <app>-<version>-windows-x64-portable.zip   no-install copy
#   SHA256SUMS.txt                             checksums the launcher verifies downloads against
#
# Nothing is code-signed (no certificate secrets): Windows SmartScreen may warn the first time.

name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $inPkg = $false
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\s*\[') { $inPkg = ($line.Trim() -eq '[workspace.package]'); continue }
            if ($inPkg -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $version = $Matches[1]; break }
          }
          if (-not $version) { throw 'no [workspace.package] version in Cargo.toml' }
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) {
            throw "tag ${{ github.ref_name }} does not match Cargo.toml version $version (expected $tag)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # The craft-fonts commit the official release pins (.github/workflows/release.yml), if any.
          $ref = Select-String -Path .github/workflows/release.yml -Pattern 'craft-fonts-ref:\s*([0-9a-f]{40})' -ErrorAction SilentlyContinue | Select-Object -First 1
          "fonts=$(if ($ref) { $ref.Matches[0].Groups[1].Value })" >> $env:GITHUB_OUTPUT

      - name: Fonts (storytold/craft-fonts, as the official release)
        if: steps.version.outputs.fonts != ''
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ steps.version.outputs.fonts }}
          path: craft-fonts

      - name: Interface translations (craft-i18n, at the commit craft-i18n.rev pins)
        id: i18n
        if: hashFiles('craft-i18n.rev') != ''
        shell: pwsh
        run: |
          "rev=$((Get-Content craft-i18n.rev -Raw).Trim())" >> $env:GITHUB_OUTPUT

      - name: Check out craft-i18n
        if: steps.i18n.outputs.rev != ''
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-i18n
          ref: ${{ steps.i18n.outputs.rev }}
          path: craft-i18n

      - name: Rust toolchain (rust-toolchain.toml)
        shell: pwsh
        run: rustup show active-toolchain || rustup toolchain install

      - name: WiX v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Build and package (MSI and portable zip)
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\upload
        run: |
          if (Test-Path craft-fonts) { $env:CRAFT_FONTS_DIR = (Resolve-Path craft-fonts).Path; $env:CRAFT_FONTS_REQUIRED = '1' }
          # Without the catalogs the interface is English only.
          if (Test-Path craft-i18n) { $env:CRAFT_I18N_DIR = (Resolve-Path craft-i18n).Path; $env:CRAFT_I18N_REQUIRED = '1' }
          pwsh packaging/windows/package.ps1 -Arch x64

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem upload -File | Where-Object { $_.Extension -notin '.msi', '.zip' -or $_.Name -match 'symbols' } | Remove-Item
          $sums = Get-ChildItem upload -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD\upload\SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-ChildItem upload | Format-Table Name, Length

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $app = '${{ github.event.repository.name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag (Get-ChildItem upload -File).FullName --clobber
          } else {
            gh release create $tag (Get-ChildItem upload -File).FullName --title "$app ${{ steps.version.outputs.version }}" --generate-notes --target $env:GITHUB_SHA
          }
